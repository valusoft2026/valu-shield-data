name: Build scam blocklist
on:
  schedule:
    - cron: "17 9 * * *"     # daily, 9:17 UTC (FTC posts weekdays)
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to fetch (first run: 30, then run again with 60)"
        default: "3"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch FTC complaints and rebuild list
        env:
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
          MAX_MINUTES: "330"
        run: python3 build_blocklist.py "${{ github.event.inputs.days || '3' }}"
      - name: Commit
        run: |
          git config user.name "valu-shield-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily blocklist $(date -u +%F)"
          git push
